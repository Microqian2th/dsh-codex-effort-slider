<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-codex-effort-slider — 观感预览（官方菜单那一行）</title>
<style>
/* ── 预览页自带的最小主题令牌（取自 DSH 官方 ui-theme 的真实取值）──
   真插件在 DSH 里直接用官方令牌，这里只是为了在浏览器里还原同一套观感。 */
body{--dsw-alias-bg-layer-1:#fff;--dsw-alias-bg-layer-2:#f5f5f5;--dsw-alias-bg-layer-3:#fff;--dsw-menu-surface-fill:#f8f9fa94;--dsw-alias-border-l1:rgb(15 17 21 / 8%);--dsw-alias-border-l2:#0000001a;--dsw-alias-label-primary:#0f1115;--dsw-alias-label-secondary:#65676b;--dsw-alias-label-tertiary:#81858c;--dsw-alias-label-caption:#a2a4a6;--dsw-alias-interactive-bg-hover:#2631480f;--dsw-alias-state-business-primary:#4d93f8;--dsw-alias-state-error-primary:#e5484d;--dsw-alias-menu-icon:#979da6;--dsw-radius-md:12px;--dsw-radius-lg:16px;--dsw-menu-backdrop-filter:blur(20px);--dsw-elevation-prominent:0 12px 32px rgb(0 0 0 / 18%);--dsw-focus-ring-width:2px;--dsw-focus-ring-color:#4d93f8;color-scheme:light}
body[data-ds-dark-theme]{--dsw-alias-bg-layer-1:#212123;--dsw-alias-bg-layer-2:#17171a;--dsw-alias-bg-layer-3:#292929;--dsw-menu-surface-fill:#43454a73;--dsw-alias-border-l1:rgb(255 255 255 / 6%);--dsw-alias-border-l2:#ffffff1f;--dsw-alias-label-primary:#ebeef2;--dsw-alias-label-secondary:#cfd3d6;--dsw-alias-label-tertiary:#adb2b8;--dsw-alias-label-caption:#979da6;--dsw-alias-interactive-bg-hover:#ffffff14;--dsw-alias-state-business-primary:#7aaaff;--dsw-alias-state-error-primary:#ff6b6b;--dsw-elevation-prominent:0 12px 32px rgb(0 0 0 / 45%);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;gap:18px;padding:32px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-primary)}
.stage{width:560px;max-width:100%}
.note{font-size:12px;line-height:1.7;color:var(--dsw-alias-label-tertiary);margin-bottom:14px}

/* 复刻官方模型菜单外壳（.menu / .cell 的真实取值：flex 行、34px 高、padding 0 8px、gap 6px） */
.mock-menu{z-index:1100;width:max-content;min-width:280px;max-width:420px;border-radius:var(--dsw-radius-lg);background:var(--dsw-menu-surface-fill);backdrop-filter:var(--dsw-menu-backdrop-filter);box-shadow:var(--dsw-elevation-prominent);border:1px solid var(--dsw-alias-border-l2);display:flex;flex-direction:column;padding:4px}
.mock-cell{box-sizing:border-box;border-radius:var(--dsw-radius-md);width:auto;min-width:100%;height:34px;color:var(--dsw-alias-label-primary);cursor:pointer;text-align:left;background:0 0;border:none;outline:none;align-items:center;gap:6px;padding:0 8px;font-size:13px;line-height:20px;display:flex;font-family:inherit}
.mock-cell:hover{background:var(--dsw-alias-interactive-bg-hover)}

/* 复刻官方**收起态**模型席按钮（triggerLabel / triggerEffort 两个 span） */
.mock-trigger{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border:0;border-radius:var(--dsw-radius-sm);background:var(--dsw-alias-interactive-bg-hover);color:var(--dsw-alias-label-primary);font:inherit;font-size:13px;cursor:pointer}

/* ── 以下是**从 lib/client.js 抽取的真 CSS** ── */
.ces-inline{--ces-accent:var(--dsw-alias-state-business-primary,var(--dsw-static-blue-450,#4d6bfe));--ces-ocean:#4d6bfe;--ces-ice:#a9d6ff;box-sizing:border-box;flex-basis:100%;width:100%;min-width:0;padding-top:2px}
.ces-track{position:relative;box-sizing:border-box;height:16px;margin-top:6px;border-radius:999px;background:var(--dsw-alias-border-l1,rgba(15,17,21,.08));box-shadow:inset 0 1px 2px rgba(9,16,45,.16),inset 0 0 0 1px rgba(127,127,127,.10),0 0 calc(var(--ces-energy,0) * 30px) rgba(77,107,254,.62),0 0 calc(var(--ces-energy,0) * 12px) rgba(53,200,255,.5);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;transition:box-shadow .24s ease}
.ces-track:focus-visible{outline:var(--dsw-focus-ring-width,2px) solid var(--dsw-focus-ring-color,var(--ces-accent));outline-offset:3px}
.ces-fill{position:absolute;top:1px;bottom:1px;left:1px;border-radius:999px;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.32)}
.ces-tick{position:absolute;top:50%;width:2px;height:2px;margin:-1px 0 0 -1px;border-radius:50%;background:rgba(128,128,128,.30);background:color-mix(in srgb,var(--dsw-alias-label-primary,#0f1115) 24%,transparent);pointer-events:none}
.ces-tick[data-on='1']{background:rgba(255,255,255,.78)}
.ces-knob{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 34% 26%,#ffffff 0%,#f4f8ff 52%,#dfe9ff 100%);box-shadow:0 0 0 1px rgba(12,22,60,.16),0 1px 3px rgba(12,22,60,.3),0 0 calc(2px + var(--ces-energy,0) * 16px) rgba(77,107,254,.8);pointer-events:none;z-index:2;transition:transform .16s ease,box-shadow .2s ease}
.ces-halo{position:absolute;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:radial-gradient(circle,rgba(77,107,254,.44) 0%,rgba(53,200,255,.2) 46%,rgba(53,200,255,0) 74%);filter:blur(3px);opacity:var(--ces-energy,0);pointer-events:none;z-index:1;animation:ces-halo 3.2s ease-in-out infinite alternate}
@keyframes ces-halo{0%{transform:scale(.86)}100%{transform:scale(1.12)}}
.ces-track:hover .ces-knob{transform:scale(1.06)}
.ces-track:active .ces-knob{transform:scale(1.14)}
.ces-error{margin-top:6px;font-size:11px;line-height:16px;color:var(--dsw-alias-state-error-primary,#e5484d)}
.ces-inline[data-energy='0'] .ces-star,.ces-inline[data-energy='0'] .ces-star__dot,.ces-inline[data-energy='0'] .ces-mote,.ces-inline[data-energy='0'] .ces-mote__dot,.ces-inline[data-energy='0'] .ces-comet,.ces-inline[data-energy='0'] .ces-energy__sweep,.ces-inline[data-energy='0'] .ces-energy::before{animation-play-state:paused}
.ces-energy{position:absolute;top:1px;bottom:1px;left:1px;border-radius:999px;overflow:hidden;pointer-events:none;opacity:var(--ces-energy,0);transition:opacity .22s ease;background:linear-gradient(90deg,rgba(3,8,28,.62) 0%,rgba(3,8,28,.22) 36%,rgba(3,8,28,.02) 62%,rgba(3,8,28,.14) 100%)}
.ces-energy::before{content:'';position:absolute;inset:-160% -14%;background:radial-gradient(34% 58% at 14% 60%,rgba(53,200,255,.62),rgba(53,200,255,0) 70%),radial-gradient(28% 66% at 46% 40%,rgba(122,152,255,.62),rgba(122,152,255,0) 72%),radial-gradient(30% 60% at 74% 62%,rgba(103,232,249,.5),rgba(103,232,249,0) 72%),radial-gradient(24% 56% at 94% 38%,rgba(169,214,255,.55),rgba(169,214,255,0) 74%);filter:blur(2px);mix-blend-mode:screen;opacity:.5;animation:ces-aurora 6.5s ease-in-out infinite alternate}
@keyframes ces-aurora{0%{transform:translate3d(-7%,0,0) scaleY(.9)}55%{transform:translate3d(2%,0,0) scaleY(1.16)}100%{transform:translate3d(9%,0,0) scaleY(1.02)}}
.ces-energy::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(53,200,255,0) 0%,rgba(53,200,255,.34) 14%,rgba(214,240,255,.26) 24%,rgba(53,200,255,.12) 32%,rgba(53,200,255,0) 44%,rgba(53,200,255,0) 62%,rgba(169,214,255,.22) 70%,rgba(103,232,249,0) 82%);background-size:200% 100%;mix-blend-mode:screen;opacity:.42;animation:ces-flow 4.6s linear infinite}
@keyframes ces-flow{0%{background-position:100% 0}100%{background-position:-100% 0}}
.ces-energy__sweep{position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.55) 50%,transparent 80%);transform:translateX(110%);animation:ces-sweep 2.8s cubic-bezier(.4,0,.55,1) infinite}
@keyframes ces-sweep{0%{transform:translateX(110%)}60%,100%{transform:translateX(-110%)}}
.ces-stars{position:absolute;top:-8px;bottom:-8px;left:1px;border-radius:999px;overflow:hidden;pointer-events:none;transition:opacity .2s ease}
.ces-star{position:absolute;left:0;right:0;height:2px;margin-top:-1px;pointer-events:none;animation-name:ces-star-sweep;animation-timing-function:linear;animation-iteration-count:infinite}
.ces-star__dot{position:absolute;left:100%;top:0;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:#fff;box-shadow:0 0 5px rgba(214,236,255,.98),0 0 11px rgba(53,200,255,.85);opacity:var(--ces-b,1);transform:scale(var(--ces-b,1));animation-name:ces-twinkle;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
@keyframes ces-twinkle{0%{opacity:calc(var(--ces-b,1) * .42);transform:scale(calc(var(--ces-b,1) * .72))}100%{opacity:var(--ces-b,1);transform:scale(var(--ces-b,1))}}
.ces-star__dot--glint::after{content:'';position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:linear-gradient(90deg,transparent 46%,rgba(255,255,255,.85) 50%,transparent 54%),linear-gradient(180deg,transparent 46%,rgba(255,255,255,.7) 50%,transparent 54%);mix-blend-mode:screen}
.ces-mote{position:absolute;left:0;right:0;height:2px;margin-top:-1px;pointer-events:none;opacity:.6;animation-name:ces-star-sweep;animation-timing-function:linear;animation-iteration-count:infinite}
.ces-mote__dot{position:absolute;left:100%;top:0;width:1.5px;height:1.5px;margin-left:-.75px;border-radius:50%;background:#cfe6ff;box-shadow:0 0 4px rgba(120,190,255,.9);opacity:var(--ces-b,1);animation-name:ces-twinkle;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
@keyframes ces-star-sweep{0%{transform:translate3d(0,0,0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translate3d(-100%,0,0);opacity:0}}
.ces-comet{position:absolute;left:0;right:0;height:1px;pointer-events:none;animation-name:ces-comet-sweep;animation-timing-function:linear;animation-iteration-count:infinite}
.ces-comet__tail{position:absolute;left:100%;top:0;width:36px;height:1px;border-radius:1px;background:linear-gradient(90deg,rgba(169,214,255,0),rgba(214,240,255,.6));box-shadow:0 0 5px rgba(120,190,255,.6)}
@keyframes ces-comet-sweep{0%{transform:translate3d(0,0,0);opacity:0}6%{opacity:.95}70%{opacity:.95}100%{transform:translate3d(-100%,0,0);opacity:0}}
body[data-ds-dark-theme] .ces-energy::before{opacity:.82}
body[data-ds-dark-theme] .ces-energy::after{opacity:.85}
body[data-ds-dark-theme] .ces-star__dot{background:#f2f8ff;box-shadow:0 0 4px rgba(214,236,255,.95),0 0 10px rgba(77,107,254,.8)}
@media (prefers-reduced-motion: reduce){.ces-energy{transition:none}.ces-energy__sweep{display:none}.ces-comet{display:none}}
.ces-set{position:fixed;z-index:2147483000;min-width:252px;max-width:340px;padding:10px 12px;border-radius:10px;box-sizing:border-box;background:var(--dsw-alias-bg-base,#fff);color:var(--dsw-alias-label-pri,#1b1c20);border:1px solid rgba(127,127,127,.28);box-shadow:0 12px 32px rgba(0,0,0,.24);font:13px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}
.ces-set__title{font-weight:600;margin:0 0 6px 0}
.ces-set__row{font-size:12px;opacity:.72;margin-bottom:8px}
.ces-set__group{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.ces-set__group label{display:flex;gap:6px;align-items:center;cursor:pointer}
.ces-set__actions{display:flex;justify-content:space-between;gap:8px}
.ces-set button{cursor:pointer;font:inherit;color:inherit;padding:4px 10px;border-radius:6px;border:1px solid rgba(127,127,127,.35);background:transparent}
.ces-set button:hover{background:rgba(127,127,127,.14)}
body[data-ds-dark-theme] .ces-set{background:var(--dsw-alias-bg-base,#24262c);color:var(--dsw-alias-label-pri,#e8e9ec)}
.ces-inline[data-reached-ticks='dim'] .ces-tick[data-on='1']{background:rgba(128,128,128,.30);background:color-mix(in srgb,var(--dsw-alias-label-primary,#0f1115) 24%,transparent)}
.ces-inline[data-reached-ticks='hidden'] .ces-tick[data-on='1']{display:none}
</style>

<body>
<div class="stage">
  <div class="note">
    这是 <b>观感预览</b>（静态复刻）：CSS 与拖动数学都是从 <code>lib/client.js</code> 抽取的真代码，
    注入手法也与插件一致（同样 4 个内联样式 + append 一个容器）。<b>拖到最右</b>看最高档能量层。
    注意输入框那一行<b>不再有任何东西</b>——控制项只在官方菜单的「推理等级」那一行里。
  </div>

  <div class="mock-menu" role="menu" aria-label="模型与推理等级">
    <button class="mock-cell" role="menuitem" type="button" id="modelRow">
      <span class="mock-cellLabel">模型</span>
      <span class="mock-cellValue">DeepSeek-V41-Flash</span>
      <svg class="mock-chev" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4 11 8.5 6.5 13"></path></svg>
    </button>
    <button class="mock-cell" role="menuitem" type="button" id="effortRow">
      <span class="mock-cellLabel">推理等级</span>
      <span class="mock-cellValue" id="effortValue">High</span>
      <svg class="mock-chev" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4 11 8.5 6.5 13"></path></svg>
    </button>
  </div>

  <div class="mock-composer">
    <button class="mock-trigger" type="button" id="seat">
      <span class="mock-triggerLabel">DeepSeek-V41-Flash</span>
      <span class="mock-triggerEffort" id="seatEffort">High</span>
      <svg class="mock-chev" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4 11 8.5 6.5 13" transform="rotate(90 8.5 8.5)"></path></svg>
    </button>
    <span class="mock-send"></span>
  </div>

  <div class="controls">
    <button id="theme">切换浅色/深色</button>
    <button id="levels4">4 档（Off/Low/High/Max）</button>
    <button id="levels2">2 档（High/Max）</button>
    <button id="levels6">6 档（含 minimal/xhigh）</button>
  </div>
</div>

<script>
/* ── 以下函数体从 lib/client.js 抽取（数学与真插件逐字一致）── */
function clamp01(value) {
      if (!(value > 0)) return 0; // 同时挡住 NaN
      return value > 1 ? 1 : value;
    }

function pctFromIndex(index, count) {
      // ⚠️ 只有一档时**直接拉满**（issue #7）：那一档就是"最大"，不是"最左/off"。
      //    count === 0（档位还没就绪）仍返回 0 —— 否则空列表会把旋钮甩到最右。
      if (count <= 0) return 0;
      if (count === 1) return 1;
      var safe = Math.max(0, Math.min(count - 1, index));
      return safe / (count - 1);
    }

function indexFromPct(pct, count) {
      if (count <= 1) return 0;
      return Math.max(0, Math.min(count - 1, Math.round(clamp01(pct) * (count - 1))));
    }

function mixColor(from, to, t) {
      var k = clamp01(t);
      return [
        Math.round(from[0] + (to[0] - from[0]) * k),
        Math.round(from[1] + (to[1] - from[1]) * k),
        Math.round(from[2] + (to[2] - from[2]) * k),
      ];
    }

function rgbOf(color) {
      return "rgb(" + color[0] + "," + color[1] + "," + color[2] + ")";
    }

function fillPartsFor(pct) {
      var t = clamp01(pct);
      if (t <= ENERGY_START) return COLOR_BLUE;
      if (t <= ENERGY_END) return mixColor(COLOR_BLUE, COLOR_MID, (t - ENERGY_START) / (ENERGY_END - ENERGY_START));
      return mixColor(COLOR_MID, COLOR_DEEP, (t - ENERGY_END) / (1 - ENERGY_END));
    }

function fillColorFor(pct) {
      return rgbOf(fillPartsFor(pct));
    }

function fillBackgroundFor(pct) {
      var end = fillPartsFor(pct);
      var mid = mixColor(COLOR_BLUE, end, 0.62);
      return "linear-gradient(90deg, " + rgbOf(COLOR_BLUE) + " 0%, " + rgbOf(mid) + " 62%, " + rgbOf(end) + " 100%)";
    }

function energyFor(pct) {
      return clamp01((clamp01(pct) - ENERGY_START) / (1 - ENERGY_START));
    }

function speedFor(pct) {
      return Math.min(2, Math.max(0.35, 3 * clamp01(pct) - 1));
    }

function particleCountFor(pct) {
      return Math.round(energyFor(pct) * PARTICLES.length);
    }

function starCountFor(pct) {
      return particleCountFor(pct);
    }

function starLayerOpacityFor(pct) {
      return 0.6 + 0.4 * energyFor(pct);
    }

function starBrightnessFor(index) {
      return STARFIELD_MIN + (1 - STARFIELD_MIN) * starHash01(index, 61);
    }

function starDurationFor(index, speedFactor) {
      var speed = Math.min(MAX_SPEED_FACTOR, Math.max(0.35, typeof speedFactor === "number" ? speedFactor : MAX_SPEED_FACTOR));
      var spread = 1 - STARFIELD_DURATION_SPREAD + 2 * STARFIELD_DURATION_SPREAD * starHash01(index, 29);
      return STARFIELD_DURATION_MEAN * MAX_SPEED_FACTOR / speed * spread;
    }

function starDelayFor(index, duration) {
      var particle = PARTICLES[index];
      var phase = particle && typeof particle.phase === "number" ? particle.phase : 0;
      var jitter = starHash01(index, 53) * 0.03; // 一点点抖动，避免看起来像整齐的队列
      return -((phase + jitter) % 1) * duration;
    }

function starHash01(index, salt) {
      var value = (index + 1) * salt * 2654435761 % 4294967296;
      return ((value >>> 8) % 1000) / 1000;
    }

function knobOffsetOf(pct) {
      var t = Math.round(clamp01(pct) * 10000) / 10000;
      return "calc(" + KNOB_RADIUS + "px + " + t + " * (100% - " + KNOB_RADIUS * 2 + "px))";
    }

function buildParticles() {
      var count = 22;
      var out = [];
      var i;
      for (i = 0; i < count; i += 1) {
        out.push({ y: 0, phase: (i + 1) * GOLDEN_RATIO % 1 });
      }
      // 相位排名：黄金比序列里排名相邻 = 在轨道上位置相邻
      var byPhase = [];
      for (i = 0; i < count; i += 1) byPhase.push(i);
      byPhase.sort(function (a, b) {
        return out[a].phase - out[b].phase;
      });
      // 高度槽：找一个满足"相位相邻至少差 MIN_HEIGHT_SLOTS 槽"的确定性随机排列
      var slots = null;
      for (var salt = 71; salt < 4000 && slots === null; salt += 1) {
        var candidate = [];
        for (i = 0; i < count; i += 1) candidate.push(i);
        candidate.sort(function (a, b) {
          var ha = starHash01(a, salt);
          var hb = starHash01(b, salt);
          return ha === hb ? a - b : ha - hb;
        });
        var ok = true;
        for (var k = 1; k < count && ok; k += 1) {
          if (Math.abs(candidate[k] - candidate[k - 1]) < MIN_HEIGHT_SLOTS) ok = false;
        }
        if (ok) slots = candidate;
      }
      if (slots === null) {
        // 兜底：步长 5 与 22 互质 → 一定是排列，且相邻槽恒差 5（≥ MIN_HEIGHT_SLOTS）
        slots = [];
        for (i = 0; i < count; i += 1) slots.push(i * 5 % count);
      }
      for (var rank = 0; rank < count; rank += 1) {
        out[byPhase[rank]].y = 8 + (slots[rank] / (count - 1)) * 84;
      }
      return out;
    }

function isOffLevel(level) {

    if (p0 !== null) detentIndex = indexFromPct(p0, LEVELS[current].length);
  }
  track.setPointerCapture(event.pointerId);
  onMove(event.clientX);
});
track.addEventListener("pointermove", function (event) { if (dragging) onMove(event.clientX); });
function end() {
  if (!dragging) return;
  dragging = false;
  var count = LEVELS[current].length;
  if (motionMode() === "fast") {
    // 快速动画：拖动中目标已经推到格子上，松手不再外推（与真实插件一致）
    snapIndex = detentIndex >= 0 ? detentIndex : indexFromPct(motion.target, count);
    snapIndex = Math.max(0, Math.min(count - 1, snapIndex));
    motion.target = pctFromIndex(snapIndex, count);
    motion.vPtr = 0;
  } else {
    // 松手：按指针速度外推落点，目标改为档位点，**速度继承**
    snapIndex = releaseIndexFor(motion.target, motion.vPtr, count);
    motion.target = pctFromIndex(snapIndex, count);
    motion.vPtr = 0;
  }
  startFrames();
}
track.addEventListener("pointerup", end);
track.addEventListener("pointercancel", end);
track.addEventListener("keydown", function (event) {
  var levels = LEVELS[current];
  var next = null;
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") next = Math.max(0, index - 1);
  else if (event.key === "ArrowRight" || event.key === "ArrowUp") next = Math.min(levels.length - 1, index + 1);
  else if (event.key === "Home") next = 0;
  else if (event.key === "End") next = levels.length - 1;
  else return;
  event.preventDefault();
  index = next;
  render();
});

function setLevels(key) {
  current = key;
  index = Math.min(index, LEVELS[key].length - 1);
  // 切档位模型时把引擎重置到当前档位（否则它会带着旧位置滑过去）
  cancelFrame(frameHandle);
  frameHandle = null;
  motion.x = pctFromIndex(index, LEVELS[key].length);
  motion.v = 0; motion.a = 0; motion.target = motion.x; motion.vPtr = 0;
  snapIndex = null;
  render();
}

/* 支持 ?level=off|low|high|max（无头截图和自查都用它定位到具体档位） */
(function applyQuery() {
  var wanted = (new URLSearchParams(location.search).get("level") || "").toLowerCase();
  if (wanted === "") return;
  var levels = LEVELS[current];
  for (var i = 0; i < levels.length; i += 1) {
    if (levels[i].id === wanted) { index = i; return; }
  }
})();

document.getElementById("theme").addEventListener("click", function () {
  if (document.body.hasAttribute("data-ds-dark-theme")) document.body.removeAttribute("data-ds-dark-theme");
  else document.body.setAttribute("data-ds-dark-theme", "");
});
document.getElementById("levels4").addEventListener("click", function () { setLevels("4"); });
document.getElementById("levels2").addEventListener("click", function () { setLevels("2"); });
document.getElementById("levels6").addEventListener("click", function () { setLevels("6"); });

render();
</script>
</body>
