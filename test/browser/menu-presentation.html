<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菜单动效与整句淡化回归</title><style>
:root{color-scheme:dark;--dsw-alias-label-secondary:#c8ccd8;--dsw-alias-label-primary:#eff0f7;--dsw-alias-label-caption:#9b9fae;--dsw-alias-border-l1:#363a47}*{box-sizing:border-box}body{margin:0;background:#13151b;color:#e9eaf1;font:15px/1.65 system-ui,'Segoe UI',sans-serif}main{max-width:920px;margin:64px auto;padding:0 32px}h1{font-size:30px;line-height:1.2;letter-spacing:-1px}p{color:#a5abba}.tag{color:#bda7ff;font-size:12px;letter-spacing:2px}.stage{height:400px;margin:36px 0;background:linear-gradient(145deg,#202430,#171a22);border:1px solid #343a48;border-radius:20px;display:flex;align-items:flex-end;padding:30px}.composer{width:100%;border:1px solid #42495a;background:#222632;border-radius:16px;padding:20px}.input{height:62px;color:#8e95a7}.toolbar{display:flex;align-items:center;gap:16px}.trigger{border:0;background:#303646;color:#ebedf7;border-radius:9px;padding:9px 12px;display:flex;align-items:center;gap:7px;font:inherit;max-width:360px;cursor:pointer}.triggerEffort{color:#b795ff}.chevron{font-size:12px;color:#929aaf}.note{font-size:12px}.menu{position:fixed;z-index:1100;width:300px;max-width:calc(100vw - 24px);padding:7px;background:#272c39;color:#ecedf5;border:1px solid #454d61;border-radius:14px;box-shadow:0 18px 60px #0007;overflow:hidden}.row{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;color:inherit;padding:13px 12px;border-radius:8px;font:inherit;cursor:pointer;text-align:left}.row:hover{background:#ffffff0d}.value{color:#bda0ff}.caption{font-size:12px;color:#989fb1;padding:4px 12px}.back{font-size:13px;color:#b3b9ca}.chip{padding:4px 9px;border:1px solid #464f65;border-radius:20px;font-size:12px;color:#b4bfd6}.status{font-size:12px;color:#8dbdac}.foot{display:flex;justify-content:space-between;gap:12px}.faux-track{height:28px;margin:5px 12px 10px;border-radius:999px;background:linear-gradient(90deg,#4d93f8,#9333ea 65%,#4c1d95);position:relative}.faux-track:after{content:'';position:absolute;top:0;left:65%;width:28px;height:28px;border-radius:50%;background:white;box-shadow:0 1px 5px #0005}button:focus-visible{outline:2px solid #a286ff;outline-offset:2px}
</style></head><body><main><div class="tag">LOCAL PREVIEW · NOT CONNECTED TO DSH</div><h1>模型与思考强度 · 弹出动效</h1><p>点击下方模型按钮：临时提示、缩放、模糊渐清与淡入。关闭时以短暂的不可交互快照淡出。</p><div class="stage"><div class="composer" data-composer-card><div class="input">这是独立本地预览，不会修改真实模型或聊天会话。</div><div class="toolbar"><button id="trigger" class="trigger" aria-haspopup="menu" aria-expanded="false" aria-label="当前模型6.1sol，思考强度High"><span class="triggerLabel">6.1sol</span><span class="triggerEffort">High</span><span class="chevron">⌄</span></button><span class="chip">仅预览</span></div></div></div><div class="foot"><div class="note">动画：打开约280ms，面板切换约200ms，关闭约180ms。<br>按钮文字整句双向交叉淡化，不按宽度逐字露出。</div><div class="status" id="status">等待操作</div></div></main><script>window.__ModuleLoader__={load(reg){window.demoPlugin=reg.factory(()=>({}));}};</script><script src="../../lib/client.js"></script><script>
const trigger=document.getElementById('trigger'),composer=trigger.closest('[data-composer-card]'),status=document.getElementById('status');
const presentation=window.demoPlugin.__internals.createMenuPresentation({doc:document,win:window});let menu=null;
function place(){if(!menu)return;const r=trigger.getBoundingClientRect();menu.style.left=Math.max(12,Math.min(r.right-menu.offsetWidth,innerWidth-menu.offsetWidth-12))+'px';menu.style.top=Math.max(12,r.top-menu.offsetHeight-10)+'px';}
window.addEventListener('resize',place);window.addEventListener('scroll',place,true);
function root(){menu.setAttribute('role','menu');menu.innerHTML='<button class="row" role="menuitem" data-next="model"><span>模型</span><span class="value">6.1sol ›</span></button><button class="row" role="menuitem" data-next="effort"><span>思考强度</span><span class="value">High ›</span></button><div class="faux-track" aria-hidden="true"></div><div class="caption">这个轨道仅展示外观；真实滑条保持原有交互。</div>';place();presentation.sync(composer);}
function panel(kind){menu.setAttribute('role',kind==='model'?'group':'menu');menu.innerHTML='<button class="row back" data-back="1">‹ 返回模型与思考强度</button><div class="caption">'+(kind==='model'?'请选择模型':'请选择思考强度')+'</div>'+ (kind==='model'?['6.1sol','6.1sol mini','另一个模型']:['Low','Medium','High','Max']).map(v=>'<button class="row" role="menuitemradio" data-pick="'+v+'"><span>'+v+'</span><span class="value">›</span></button>').join('');place();presentation.sync(composer);}
function open(){menu=document.createElement('div');menu.id='demo-menu';menu.className='menu';document.body.appendChild(menu);trigger.setAttribute('aria-expanded','true');trigger.setAttribute('aria-controls',menu.id);root();status.textContent='菜单已打开 · 提示文字已切换';menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.next)panel(b.dataset.next);else if(b.dataset.back)root();else if(b.dataset.pick){if(menu.getAttribute('role')==='group')trigger.querySelector('.triggerLabel').textContent=b.dataset.pick;else trigger.querySelector('.triggerEffort').textContent=b.dataset.pick;close();}});}
function close(){if(!menu)return;trigger.setAttribute('aria-expanded','false');trigger.removeAttribute('aria-controls');menu.remove();menu=null;presentation.sync(composer);status.textContent='已关闭 · 原文字保留';}
trigger.addEventListener('click',()=>menu?close():open());document.addEventListener('pointerdown',e=>{if(menu&&!menu.contains(e.target)&&!trigger.contains(e.target))close();});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
window.addEventListener('error',e=>{document.body.dataset.error=e.message;status.textContent=e.message;});
if(new URLSearchParams(location.search).has('capture')){open();requestAnimationFrame(()=>{document.getAnimations().forEach(a=>{a.pause();a.currentTime=95;});document.body.dataset.capture='ready';});}
if(new URLSearchParams(location.search).has('verify')){open();setTimeout(()=>{const checks=[];checks.push(trigger.querySelector('[data-ces-part="trigger-prompt"]').textContent==='请选择模型或思考强度');checks.push(getComputedStyle(trigger.querySelector('.triggerLabel')).display==='none');panel('model');checks.push(menu.getAttribute('role')==='group');setTimeout(()=>{close();checks.push(trigger.querySelector('[data-ces-part="trigger-prompt"]')===null);checks.push(document.querySelector('[data-ces-menu-ghost="1"]')!==null);const exit=document.querySelector('[data-ces-menu-ghost="1"]')?.getAnimations()[0];checks.push(exit?.effect.getTiming().duration===180);checks.push(trigger.querySelector('.triggerLabel').getAnimations().length>0);setTimeout(()=>{checks.push(document.querySelector('[data-ces-menu-ghost="1"]')===null);const result=document.createElement('pre');result.id='browser-verification';result.textContent=checks.every(Boolean)?'PASS: native WAAPI, prompt visibility, model panel, original labels and inert ghost cleanup':'FAIL: '+JSON.stringify(checks);document.body.appendChild(result);},260);},220);},280);}
if(new URLSearchParams(location.search).has('verify')){const box=document.createElement('div');box.style.cssText='position:fixed;left:20px;top:20px;width:180px;height:60px;pointer-events:none';const border=document.createElement('div');border.className='ces-row-outline';box.appendChild(border);document.body.appendChild(box);getComputedStyle(border).opacity;requestAnimationFrame(()=>{border.style.opacity='1';getComputedStyle(border).opacity;requestAnimationFrame(()=>{const transition=border.getAnimations().find(a=>a.transitionProperty==='opacity');const result=document.createElement('pre');result.id='border-verification';result.textContent=transition&&transition.effect.getTiming().duration===180?'PASS: native purple-border opacity transition 180ms':'FAIL: native purple-border transition missing';document.body.appendChild(result);box.remove();});});}
</script><script src="menu-presentation.verify.js"></script></body></html>
